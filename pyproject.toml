[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hmcts-fastapi-azure-auth"
version = "0.1.0"
description = "FastAPI Azure AD authentication and RBAC library for HMCTS applications"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "pyjwt>=2.9.0",
    "cryptography>=42.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "pytest-mock>=3.14.0",
    "hatch>=1.14.0",
]

[tool.hatch.build.targets.wheel]
packages = ["hmcts_azure_auth"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
